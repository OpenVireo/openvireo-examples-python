[project]
name = "openvireo-examples"
version = "1.2.2"
description = "Runnable examples for the OpenVireo Python binding"
requires-python = ">=3.10"
dependencies = ["openvireo[keyring]==1.2.2"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pyright==1.1.408"]

[tool.pyright]
include = ["examples"]
extraPaths = ["examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
